[project]
name = "tetris-state-vision"
version = "0.3.0"
description = "Standalone Tetris image-to-state research: contracts and synthetic data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13"]

[project.optional-dependencies]
train = ["torch>=2.14,<2.15", "numpy>=2,<3"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[project.scripts]
tetris-vision = "tetris_vision.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tetris_vision"]
