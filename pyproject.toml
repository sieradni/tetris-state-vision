[project]
name = "tetris-state-vision"
version = "0.1.0"
description = "Standalone Tetris image-to-state research: contracts and synthetic data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13"]

[project.scripts]
tetris-vision = "tetris_vision.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tetris_vision"]
